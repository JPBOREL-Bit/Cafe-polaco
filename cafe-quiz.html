<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Mundo del Café · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f2e6d3; --parchment-dark:#e3cda3; --ink:#2a1b10; --ink-soft:#4f3520;
    --navy:#3b2415; --navy-deep:#1b110a; --gold:#a9702f; --gold-bright:#d99a4e;
    --wax:#7a3b1e; --wax-bright:#a8532b; --good:#2f6e4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Spectral',serif; color:var(--ink);
    background: radial-gradient(ellipse at 20% -10%, rgba(169,112,47,.25), transparent 55%),
                radial-gradient(ellipse at 90% 110%, rgba(59,36,21,.35), transparent 50%),
                var(--navy-deep);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px 80px;
  }
  .stage{width:100%; max-width:640px;}
  .hero{text-align:center; color:var(--parchment); padding:6px 6px 28px; animation:dropIn .8s ease both;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{font-family:'JetBrains Mono',monospace; letter-spacing:.3em; font-size:11px; text-transform:uppercase; color:var(--gold-bright); margin-bottom:8px;}
  .hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(32px,7.6vw,52px); line-height:1.05; margin:0 0 8px;}
  .hero h1 em{font-style:italic; color:var(--gold-bright);}
  .hero .sub{font-family:'Spectral',serif; font-style:italic; font-size:15px; color:#d9c9ab; max-width:460px; margin:0 auto;}

  .card{
    background:linear-gradient(160deg,var(--parchment) 0%,var(--parchment-dark) 100%);
    border-radius:6px; box-shadow:0 30px 60px -20px rgba(20,14,6,.35);
    padding:34px 30px 28px; position:relative; animation:riseIn .8s .1s ease both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(42,27,16,.18);border-radius:3px;pointer-events:none;}

  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.15em; color:var(--wax); text-transform:uppercase; display:block; margin-bottom:10px;}
  p.body-text{font-size:16px; line-height:1.65; color:var(--ink-soft); margin:0 0 20px;}
  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    background:var(--wax); color:#fdf6e8; border:none; padding:15px 26px; border-radius:8px; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(122,59,30,.6); transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  .waiting{display:flex; align-items:center; gap:12px; color:var(--ink-soft); font-size:14px;}
  .dot-pulse{width:9px;height:9px;border-radius:50%; background:var(--gold); animation:pulse 1.2s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  .intro-anim{animation:fadeSlide .6s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .q-text{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(20px,3.4vw,25px); line-height:1.28; margin:0 0 20px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background:rgba(255,252,242,.55); border:1.5px solid rgba(42,27,16,.18);
    border-radius:8px; padding:14px 16px; font-family:'Spectral',serif; font-size:16px; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--gold); background:rgba(255,252,242,.85); transform:translateX(3px);}
  .opt:disabled{cursor:default;}
  .opt.selected{border-color:var(--navy); background:rgba(59,36,21,.12);}
  .opt .letter{font-family:'JetBrains Mono',monospace; font-size:12px; width:22px;height:22px;border-radius:50%;
    border:1.5px solid rgba(42,27,16,.3); display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);}
  .opt.selected .letter{background:var(--navy); border-color:var(--navy); color:#fff;}

  .score-big{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(60px,14vw,92px); line-height:1; color:var(--navy); margin:4px 0 0; text-align:center;}
  .score-of{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; text-align:center; display:block; margin-bottom:18px;}
  .review-item{font-size:13px; padding:11px 13px; border-radius:6px; margin-bottom:8px; background:rgba(255,252,242,.5);}
  .review-item .qline{color:var(--ink); margin-bottom:4px;}
  .review-item .aline{font-family:'JetBrains Mono',monospace; font-size:11px;}
  .ok{color:var(--good);} .bad{color:var(--wax-bright);}

  .expelled-box{text-align:center; padding:10px;}
  .expelled-box .big{font-size:40px; margin-bottom:10px;}

  footer.tag2{text-align:center; margin-top:24px; color:#a5957c; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;}
</style>
</head>
<body>
<div class="stage">
  <div class="hero">
    <div class="eyebrow" id="hero-eyebrow">CULTURA CAFETERA · ORIGEN Y PREPARACIÓN</div>
    <h1><span id="hero-line1">¿CUÁNTO SABÉS</span><br><em id="hero-line2">DE CAFÉ?</em></h1>
    <p class="sub" id="hero-sub">Poné a prueba tus conocimientos sobre el origen, el cultivo y la preparación del café.</p>
  </div>
  <div class="card" id="card">
    <p class="body-text">Conectando…</p>
  </div>
  <footer class="tag2" id="footer-text">Quiz sobre el Café · Origen, cultivo y preparación</footer>
</div>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCTkf0CCZxVAxX-xnjVorQ_ZAo_ey4cgZs",
  authDomain: "cafe-polaco-5dca0.firebaseapp.com",
  databaseURL: "https://cafe-polaco-5dca0-default-rtdb.firebaseio.com",
  projectId: "cafe-polaco-5dca0",
  storageBucket: "cafe-polaco-5dca0.firebasestorage.app",
  messagingSenderId: "344245058859",
  appId: "1:344245058859:web:48c7ce0bb1a5857a50596e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
/* ===================== DEFAULT CONTENT (8 rondas x 1 pregunta) ===================== */
const DEFAULT_ROUNDS = [
{intro:"Según la tradición más difundida, el café fue descubierto en Etiopía alrededor del siglo IX por un pastor de cabras llamado Kaldi. Kaldi notó que sus cabras se ponían inusualmente enérgicas después de comer los frutos rojos de un arbusto silvestre. Al probarlos él mismo, sintió un efecto similar, y así habría comenzado la historia del café como lo conocemos.",
 questions:[
  {text:"¿En qué región se originó el café según la tradición?",opts:[
    {t:"Etiopía",c:true},{t:"Colombia",c:false},
    {t:"Brasil",c:false},{t:"Vietnam",c:false}]}
 ]},
{intro:"Desde el Cuerno de África, el consumo de café se organizó y expandió por primera vez en la península arábiga. Hacia el siglo XV, en Yemen, los granos comenzaron a tostarse y prepararse como bebida en un contexto religioso y social. Allí surgieron también las primeras casas de café, llamadas “qahveh khaneh”, que luego se replicarían en todo el mundo islámico.",
 questions:[
  {text:"¿En qué actual país se cultivó y consumió café de forma organizada por primera vez, hacia el siglo XV?",opts:[
    {t:"Yemen",c:true},{t:"Turquía",c:false},
    {t:"Egipto",c:false},{t:"Italia",c:false}]}
 ]},
{intro:"El café llegó a Europa a través del comercio marítimo con el mundo otomano. En el siglo XVII, Venecia, como principal puerto comercial con Oriente, recibió los primeros cargamentos y abrió una de las primeras cafeterías europeas. Desde allí, la bebida se difundió rápidamente por el resto del continente, generando tanto entusiasmo como desconfianza inicial.",
 questions:[
  {text:"¿Qué ciudad italiana recibió los primeros cargamentos de café hacia Europa en el siglo XVII?",opts:[
    {t:"Roma",c:false},{t:"Venecia",c:true},
    {t:"Milán",c:false},{t:"Nápoles",c:false}]}
 ]},
{intro:"Botánicamente, el café pertenece al género Coffea, pero solo dos especies dominan el mercado mundial. La Coffea arabica, más suave y aromática, representa la mayor parte de la producción de calidad. La Coffea canephora, conocida comercialmente como Robusta, tiene más cafeína, más cuerpo y resiste mejor las plagas, aunque suele considerarse de perfil más simple.",
 questions:[
  {text:"¿Cuáles son las dos especies de café más cultivadas comercialmente en el mundo?",opts:[
    {t:"Liberica y Excelsa",c:false},{t:"Bourbon y Typica",c:false},
    {t:"Arábica y Robusta",c:true},{t:"Catuaí y Caturra",c:false}]}
 ]},
{intro:"La producción mundial de café se concentra en el llamado “cinturón cafetero”, la franja tropical entre los trópicos de Cáncer y Capricornio. Desde el siglo XIX, un país de América del Sur domina ampliamente el ranking de producción y exportación, gracias a la extensión de sus tierras cultivables y a más de un siglo de desarrollo de la industria cafetera.",
 questions:[
  {text:"¿Cuál es el mayor país productor de café del mundo?",opts:[
    {t:"Colombia",c:false},{t:"Vietnam",c:false},
    {t:"Brasil",c:true},{t:"Etiopía",c:false}]}
 ]},
{intro:"El cafeto es un arbusto que da un fruto carnoso, similar a una baya, que pasa del verde al rojo (o amarillo, según la variedad) al madurar. Dentro de ese fruto se encuentran, generalmente, dos semillas: los granos de café. Luego de la cosecha, el fruto pasa por procesos de beneficio —lavado, natural u honey— que separan la semilla de la pulpa y determinan parte del perfil de sabor final.",
 questions:[
  {text:"¿Cómo se llama el fruto del cafeto que contiene los granos de café?",opts:[
    {t:"Cereza de café",c:true},{t:"Vaina",c:false},
    {t:"Drupa dulce",c:false},{t:"Baya seca",c:false}]}
 ]},
{intro:"Una vez secos, los granos verdes de café no tienen aroma ni sabor característico hasta que se tuestan. Durante el tueste, el calor provoca reacciones químicas (como la reacción de Maillard) que desarrollan azúcares, ácidos y aromas. El tiempo y la temperatura aplicados determinan si el tueste resulta claro, medio u oscuro, y eso cambia drásticamente la acidez, el cuerpo y el dulzor de la taza.",
 questions:[
  {text:"¿Qué determina principalmente el nivel de tueste del café?",opts:[
    {t:"El tipo de agua usada para tostar",c:false},{t:"El país de origen exclusivamente",c:false},
    {t:"El tiempo y la temperatura de tostado",c:true},{t:"El tamaño del grano sin moler",c:false}]}
 ]},
{intro:"Existen decenas de métodos para preparar café, cada uno con su propia física de extracción. Uno de los más influyentes es el espresso, desarrollado en Italia a comienzos del siglo XX, que consiste en forzar agua caliente a alta presión a través de café molido muy fino durante apenas unos segundos, produciendo una bebida concentrada y con crema característica.",
 questions:[
  {text:"¿Qué método de preparación consiste en forzar agua caliente a presión a través de café molido fino?",opts:[
    {t:"Prensa francesa",c:false},{t:"Café turco",c:false},
    {t:"Goteo (filtrado)",c:false},{t:"Espresso",c:true}]}
 ]}
];

const DEFAULT_UI = {
  heroEyebrow: "CULTURA CAFETERA · ORIGEN Y PREPARACIÓN",
  heroLine1: "¿CUÁNTO SABÉS",
  heroLine2: "DE CAFÉ?",
  heroSub: "Poné a prueba tus conocimientos sobre el origen, el cultivo y la preparación del café.",
  lobbyTag: "QUIZ DE CAFÉ",
  lobbyText: "8 rondas · 8 preguntas · 4 opciones por pregunta. Solo una respuesta es correcta. ¿Estás listo para poner a prueba cuánto sabés sobre el café?",
  joinBtn: "COMENZAR QUIZ",
  waitingStart: "Preparate para el aroma del conocimiento. El quiz está por comenzar...",
  footerText: "Quiz sobre el Café · Origen, cultivo y preparación",
  finalExtra: "El café es el resultado de un largo proceso agrícola, cultural e industrial. ¿Cuánto sabías realmente?"
};

/* ===================== DEVICE DETECTION ===================== */
function legacyDetect(){
  const ua = navigator.userAgent || '';
  let os = 'Dispositivo desconocido';
  if(/iPhone/i.test(ua)) os = 'iPhone';
  else if(/iPad/i.test(ua)) os = 'iPad';
  else if(/Android/i.test(ua)){
    const m = ua.match(/Android[^;]*;\s*([^)]+)\)/i);
    let raw = m && m[1] ? m[1].split('Build')[0].trim() : 'Android';
    os = (raw === 'K' || raw.length < 2) ? 'Android' : raw;
  }
  else if(/Macintosh/i.test(ua)) os = 'Mac';
  else if(/Windows/i.test(ua)) os = 'Windows PC';
  else if(/Linux/i.test(ua)) os = 'Linux';

  let browser = 'Navegador';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/OPR\//i.test(ua)) browser = 'Opera';
  else if(/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) browser = 'Chrome';
  else if(/CriOS/i.test(ua)) browser = 'Chrome iOS';
  else if(/FxiOS/i.test(ua)) browser = 'Firefox iOS';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua)) browser = 'Safari';

  return os + ' · ' + browser;
}

async function detectDevice(){
  let result = null;
  try{
    if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      const hints = await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion']);
      const model = (hints.model || '').trim();
      const platform = (hints.platform || '').trim();
      if(model && model.length > 1){
        result = model + (platform ? ' · '+platform : '');
      } else if(platform){
        const legacyParts = legacyDetect().split(' · ');
        result = legacyParts[1] ? platform + ' · ' + legacyParts[1] : platform;
      }
    }
  }catch(e){ /* sigue al fallback */ }
  if(!result){ result = legacyDetect(); }
  try{
    const w = window.screen && window.screen.width;
    const h = window.screen && window.screen.height;
    if(w && h) result += ' (' + w + '×' + h + ')';
  }catch(e){}
  return result;
}

/* ===================== IDENTIDAD PERSISTENTE DEL DISPOSITIVO ===================== */
function getOrCreateUserId(){
  try{
    let id = localStorage.getItem('cafe_device_id');
    if(!id){
      id = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem('cafe_device_id', id);
    }
    return id;
  }catch(e){
    return 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
}

/* ===================== STATE ===================== */
const userId = getOrCreateUserId();
let deviceLabel = 'Detectando dispositivo…';
let joined = false;
let expelled = false;
let record = {id:userId, device:deviceLabel, answers:[]};
let rounds = DEFAULT_ROUNDS;
let currentShuffled = null;
let lastKey = '';
let ui = DEFAULT_UI;

const card = document.getElementById('card');

function totalQuestions(){
  return rounds.reduce((sum,r)=> sum + (r.questions ? r.questions.length : 0), 0);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function saveRecord(){
  db.ref('users/'+userId).set(record).catch(e=>console.error(e));
}

/* ===================== TEXTOS GENERALES ===================== */
db.ref('uitext').on('value', (snap)=>{
  const v = snap.val();
  ui = v ? Object.assign({}, DEFAULT_UI, v) : DEFAULT_UI;
  document.getElementById('hero-eyebrow').textContent = ui.heroEyebrow;
  document.getElementById('hero-line1').textContent = ui.heroLine1;
  document.getElementById('hero-line2').textContent = ui.heroLine2;
  document.getElementById('hero-sub').textContent = ui.heroSub;
  document.getElementById('footer-text').textContent = ui.footerText;
  if(!joined) renderLobby();
});

/* ===================== SCREENS ===================== */
function renderLobby(){
  card.innerHTML = `
    <span class="tag">${ui.lobbyTag}</span>
    <p class="body-text">${ui.lobbyText}</p>
    <button class="btn" id="join-btn">${ui.joinBtn}</button>
  `;
  document.getElementById('join-btn').addEventListener('click', async ()=>{
    const btn = document.getElementById('join-btn');
    btn.disabled = true;
    deviceLabel = await detectDevice();
    record.device = deviceLabel;
    joined = true;
    saveRecord();
    watchOwnRecord();
    renderWaiting(ui.waitingStart);
  });
}

function renderWaiting(msg){
  card.innerHTML = `
    <span class="tag">En espera</span>
    <div class="waiting"><div class="dot-pulse"></div><span>${msg}</span></div>
  `;
}

function renderIntro(round){
  const r = rounds[round-1];
  card.innerHTML = `
    <div class="intro-anim">
      <span class="tag">Ronda ${round} de ${rounds.length} · Introducción</span>
      <p class="body-text">${(r && r.intro) || 'La preparación está por comenzar…'}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Esperando la pregunta…</span></div>
    </div>
  `;
}

function renderQuestion(state){
  const r = rounds[state.round-1];
  const item = r.questions[state.qIndex];
  const key = 'r'+state.round+'-'+state.qIndex;
  const already = record.answers.find(a=>a.round===state.round && a.qIndex===state.qIndex);

  if(key !== lastKey){
    currentShuffled = shuffle(item.opts);
    lastKey = key;
  }
  const letters = ['A','B','C','D'];

  if(already){
    card.innerHTML = `
      <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta ${state.qIndex+1} de ${r.questions.length}</span>
      <p class="q-text">${item.text}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Respuesta guardada. Esperando…</span></div>
    `;
    return;
  }

  card.innerHTML = `
    <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta ${state.qIndex+1} de ${r.questions.length}</span>
    <p class="q-text">${item.text}</p>
    <div class="options" id="opts"></div>
  `;
  const wrap = document.getElementById('opts');
  currentShuffled.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">'+letters[idx]+'</span><span>'+opt.t+'</span>';
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#opts .opt').forEach(o=>o.disabled=true);
      btn.classList.add('selected');
      record.answers.push({round:state.round, qIndex:state.qIndex, text:item.text, sel:opt.t, correct:opt.c});
      saveRecord();
      renderWaiting('Respuesta guardada. Esperando la siguiente ronda…');
    });
    wrap.appendChild(btn);
  });
}

function renderFinal(){
  const all = record.answers;
  const correctCount = all.filter(a=>a.correct).length;
  const total = totalQuestions();
  const scoreTen = Math.round((correctCount/total)*10*10)/10;
  let rows = '';
  all.slice().sort((a,b)=> (a.round*10+a.qIndex) - (b.round*10+b.qIndex)).forEach((a,i)=>{
    rows += '<div class="review-item"><div class="qline">'+(i+1)+'. '+a.text+'</div><div class="aline '+(a.correct?'ok':'bad')+'">'+(a.correct?'✓ Correcta':'✗ Incorrecta')+' — tu respuesta: '+a.sel+'</div></div>';
  });
  card.innerHTML = `
    <span class="tag">Resultado final</span>
    <div class="score-big">${scoreTen}</div>
    <div class="score-of">SOBRE 10 · ${correctCount} DE ${total} CORRECTAS</div>
    <div>${rows}</div>
    ${ui.finalExtra ? '<p class="body-text" style="margin-top:20px;">'+ui.finalExtra+'</p>' : ''}
    <p style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:#a5957c; margin-top:26px;">Creado por Juan Pablo Borel</p>
  `;
}

function renderExpelled(){
  card.innerHTML = `
    <div class="expelled-box">
      <div class="big">🚪</div>
      <span class="tag">Fuera del quiz</span>
      <p class="body-text">El administrador te quitó de esta sesión. Si fue un error, pedile que te deje volver a entrar.</p>
    </div>
  `;
}

/* ===================== VIGILAR EL PROPIO REGISTRO (para detectar expulsión) ===================== */
function watchOwnRecord(){
  db.ref('users/'+userId).on('value', (snap)=>{
    if(!joined) return;
    if(snap.val() === null && !expelled){
      expelled = true;
      renderExpelled();
    }
  });
}

/* ===================== RESTAURAR SESIÓN SI YA HABÍA ENTRADO ===================== */
db.ref('users/'+userId).once('value').then(async (snap)=>{
  const existing = snap.val();
  if(existing){
    record = existing;
    if(!record.answers) record.answers = [];
    joined = true;
    const fresh = await detectDevice();
    if(fresh && fresh !== record.device){
      record.device = fresh;
      saveRecord();
    }
    watchOwnRecord();
  }
});

/* ===================== CONTENIDO ===================== */
db.ref('quizdata').on('value', (snap)=>{
  const val = snap.val();
  if(val && val.rounds && val.rounds.length){ rounds = val.rounds; }
});

/* ===================== ESTADO DEL QUIZ EN VIVO ===================== */
db.ref('quizstate').on('value', (snap)=>{
  if(!joined || expelled) return;
  const state = snap.val() || {phase:'lobby'};
  if(state.phase === 'lobby'){
    renderWaiting(ui.waitingStart);
  } else if(state.phase === 'intro'){
    renderIntro(state.round);
  } else if(state.phase === 'question'){
    renderQuestion(state);
  } else if(state.phase === 'finished'){
    renderFinal();
  }
});

renderLobby();
</script>
</body>
</html>
