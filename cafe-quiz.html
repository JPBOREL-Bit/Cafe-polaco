<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz del Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#ece2c8; --parchment-dark:#ddcda3; --ink:#241a10; --ink-soft:#4a3826;
    --navy:#1c2b4a; --navy-deep:#101a30; --gold:#b8893f; --gold-bright:#e0ac52;
    --wax:#8a2f2f; --wax-bright:#b23c3c; --good:#2f6e4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Spectral',serif; color:var(--ink);
    background: radial-gradient(ellipse at 20% -10%, rgba(184,137,63,.25), transparent 55%),
                radial-gradient(ellipse at 90% 110%, rgba(28,43,74,.35), transparent 50%),
                var(--navy-deep);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px 80px;
  }
  .stage{width:100%; max-width:640px;}
  .hero{text-align:center; color:var(--parchment); padding:6px 6px 28px; animation:dropIn .8s ease both;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{font-family:'JetBrains Mono',monospace; letter-spacing:.3em; font-size:11px; text-transform:uppercase; color:var(--gold-bright); margin-bottom:8px;}
  .hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(32px,7.6vw,52px); line-height:1.05; margin:0 0 8px;}
  .hero h1 em{font-style:italic; color:var(--gold-bright);}
  .hero .sub{font-family:'Spectral',serif; font-style:italic; font-size:15px; color:#cfc6b3; max-width:460px; margin:0 auto;}

  .card{
    background:linear-gradient(160deg,var(--parchment) 0%,var(--parchment-dark) 100%);
    border-radius:6px; box-shadow:0 30px 60px -20px rgba(20,14,6,.35);
    padding:34px 30px 28px; position:relative; animation:riseIn .8s .1s ease both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(36,26,16,.18);border-radius:3px;pointer-events:none;}

  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.15em; color:var(--wax); text-transform:uppercase; display:block; margin-bottom:10px;}
  p.body-text{font-size:16px; line-height:1.65; color:var(--ink-soft); margin:0 0 20px;}
  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    background:var(--wax); color:#fdf6e8; border:none; padding:15px 26px; border-radius:8px; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(138,47,47,.6); transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  .waiting{display:flex; align-items:center; gap:12px; color:var(--ink-soft); font-size:14px;}
  .dot-pulse{width:9px;height:9px;border-radius:50%; background:var(--gold); animation:pulse 1.2s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  .intro-anim{animation:fadeSlide .6s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .q-text{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(20px,3.4vw,25px); line-height:1.28; margin:0 0 20px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background:rgba(255,252,242,.55); border:1.5px solid rgba(36,26,16,.18);
    border-radius:8px; padding:14px 16px; font-family:'Spectral',serif; font-size:16px; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--gold); background:rgba(255,252,242,.85); transform:translateX(3px);}
  .opt:disabled{cursor:default;}
  .opt.selected{border-color:var(--navy); background:rgba(28,43,74,.12);}
  .opt .letter{font-family:'JetBrains Mono',monospace; font-size:12px; width:22px;height:22px;border-radius:50%;
    border:1.5px solid rgba(36,26,16,.3); display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);}
  .opt.selected .letter{background:var(--navy); border-color:var(--navy); color:#fff;}

  .score-big{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(60px,14vw,92px); line-height:1; color:var(--navy); margin:4px 0 0; text-align:center;}
  .score-of{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; text-align:center; display:block; margin-bottom:18px;}
  .review-item{font-size:13px; padding:11px 13px; border-radius:6px; margin-bottom:8px; background:rgba(255,252,242,.5);}
  .review-item .qline{color:var(--ink); margin-bottom:4px;}
  .review-item .aline{font-family:'JetBrains Mono',monospace; font-size:11px;}
  .ok{color:var(--good);} .bad{color:var(--wax-bright);}

  .expelled-box{text-align:center; padding:10px;}
  .expelled-box .big{font-size:40px; margin-bottom:10px;}

  footer.tag2{text-align:center; margin-top:24px; color:#8b8168; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;}
</style>
</head>
<body>
<div class="stage">
  <div class="hero">
    <div class="eyebrow" id="hero-eyebrow">CAFÉ · QUIZ</div>
    <h1><span id="hero-line1">¿CUÁNTO SABÉS</span><br><em id="hero-line2">DEL CAFÉ?</em></h1>
    <p class="sub" id="hero-sub">Poné a prueba tus conocimientos sobre el café, sus granos, preparación y características.</p>
  </div>
  <div class="card" id="card">
    <p class="body-text">Conectando…</p>
  </div>
  <footer class="tag2" id="footer-text">Quiz sobre el café · 8 rondas</footer>
</div>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCTkf0CCZxVAxX-xnjVorQ_ZAo_ey4cgZs",
  authDomain: "cafe-polaco-5dca0.firebaseapp.com",
  databaseURL: "https://cafe-polaco-5dca0-default-rtdb.firebaseio.com",
  projectId: "cafe-polaco-5dca0",
  storageBucket: "cafe-polaco-5dca0.firebasestorage.app",
  messagingSenderId: "344245058859",
  appId: "1:344245058859:web:48c7ce0bb1a5857a50596e",
  measurementId: "G-3FS4ST5FLJ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
/* ===================== DEFAULT CONTENT (8 rondas x 1 pregunta) ===================== */
const DEFAULT_ROUNDS = [
{intro:"El café se obtiene de las semillas que se encuentran dentro de los frutos del cafeto, conocidos comúnmente como cerezas de café. Después de recolectarlas, las semillas se procesan, se secan y finalmente se tuestan para desarrollar sus aromas y sabores.",questions:[{text:"¿De dónde se obtienen los granos de café?",opts:[{t:"De las semillas del fruto del cafeto",c:true},{t:"De las hojas del cafeto",c:false},{t:"De las raíces del cafeto",c:false},{t:"De las flores secas del cafeto",c:false}]}]},
{intro:"Entre las especies de café más conocidas se encuentran Coffea arabica y Coffea canephora, esta última conocida como robusta. El arábica suele asociarse con perfiles aromáticos y suaves, mientras que el robusta suele presentar mayor intensidad y más cafeína.",questions:[{text:"¿Cómo se conoce comúnmente a Coffea canephora?",opts:[{t:"Arábica",c:false},{t:"Robusta",c:true},{t:"Liberica",c:false},{t:"Moka",c:false}]}]},
{intro:"El tostado transforma el grano verde mediante el calor. Durante este proceso ocurren reacciones químicas que producen gran parte de los aromas, colores y sabores característicos del café tostado. El nivel de tostado puede variar desde claro hasta oscuro.",questions:[{text:"¿Qué proceso desarrolla gran parte de los aromas y sabores del café?",opts:[{t:"La congelación",c:false},{t:"El tostado",c:true},{t:"La molienda en seco",c:false},{t:"La fermentación de la bebida preparada",c:false}]}]},
{intro:"La molienda consiste en reducir los granos tostados a partículas más pequeñas. El tamaño de esas partículas debe adaptarse al método de preparación: por ejemplo, el espresso suele utilizar una molienda fina, mientras que otros métodos requieren moliendas diferentes.",questions:[{text:"¿Qué suele utilizarse para preparar un espresso?",opts:[{t:"Una molienda muy fina",c:true},{t:"Granos enteros sin moler",c:false},{t:"Una molienda extremadamente gruesa",c:false},{t:"Café instantáneo sin agua",c:false}]}]},
{intro:"El espresso es una preparación de café concentrada que se obtiene haciendo pasar agua caliente a presión a través de café molido. Es la base de muchas bebidas de cafetería, como el cappuccino, el latte y el macchiato.",questions:[{text:"¿Qué caracteriza principalmente al espresso?",opts:[{t:"Se prepara pasando agua caliente a presión por café molido",c:true},{t:"Se prepara solamente con leche fría",c:false},{t:"Se prepara sin agua",c:false},{t:"Se prepara hirviendo directamente los granos enteros",c:false}]}]},
{intro:"El cappuccino es una bebida de café preparada tradicionalmente con espresso, leche caliente y espuma de leche. La combinación de café y leche produce una bebida cremosa y de sabor equilibrado.",questions:[{text:"¿Qué combinación caracteriza al cappuccino?",opts:[{t:"Espresso, leche caliente y espuma de leche",c:true},{t:"Solo espresso y agua fría",c:false},{t:"Café filtrado y jugo de naranja",c:false},{t:"Espresso y chocolate exclusivamente",c:false}]}]},
{intro:"El café filtrado utiliza agua caliente que atraviesa el café molido y pasa a través de un filtro. El filtro retiene gran parte de las partículas sólidas, mientras la bebida preparada continúa hacia el recipiente.",questions:[{text:"¿Qué hace principalmente el filtro en el café filtrado?",opts:[{t:"Retiene gran parte de las partículas sólidas del café",c:true},{t:"Convierte el café en leche",c:false},{t:"Aumenta la cantidad de granos enteros",c:false},{t:"Elimina toda la cafeína automáticamente",c:false}]}]},
{intro:"La cafeína es un compuesto natural presente en el café y en otras plantas. Es una sustancia estimulante y su cantidad en una bebida puede variar según la especie de café, la cantidad utilizada y el método de preparación.",questions:[{text:"¿Qué sustancia estimulante está naturalmente presente en el café?",opts:[{t:"Cafeína",c:true},{t:"Glucosa",c:false},{t:"Clorofila",c:false},{t:"Colágeno",c:false}]}]}
];

const DEFAULT_UI = {
  quizVersion: "coffee-1",
  heroEyebrow: "CAFÉ · QUIZ",
  heroLine1: "¿CUÁNTO SABÉS",
  heroLine2: "DEL CAFÉ?",
  heroSub: "Poné a prueba tus conocimientos sobre el café, sus granos, preparación y características.",
  lobbyTag: "QUIZ DEL CAFÉ",
  lobbyText: "8 rondas · 8 preguntas · 4 opciones por pregunta. Solo una respuesta es correcta. ¿Estás listo para poner a prueba cuánto sabés sobre el café?",
  joinBtn: "COMENZAR QUIZ",
  waitingStart: "Prepará tus conocimientos. El quiz está por comenzar...",
  footerText: "Quiz sobre el café · 8 rondas",
  finalExtra: "El café combina ciencia, tradición y muchas formas de preparación. ¿Cuánto aprendiste?"
};

/* ===================== DEVICE DETECTION ===================== */
function legacyDetect(){
  const ua = navigator.userAgent || '';
  let os = 'Dispositivo desconocido';
  if(/iPhone/i.test(ua)) os = 'iPhone';
  else if(/iPad/i.test(ua)) os = 'iPad';
  else if(/Android/i.test(ua)){
    const m = ua.match(/Android[^;]*;\s*([^)]+)\)/i);
    let raw = m && m[1] ? m[1].split('Build')[0].trim() : 'Android';
    os = (raw === 'K' || raw.length < 2) ? 'Android' : raw;
  }
  else if(/Macintosh/i.test(ua)) os = 'Mac';
  else if(/Windows/i.test(ua)) os = 'Windows PC';
  else if(/Linux/i.test(ua)) os = 'Linux';

  let browser = 'Navegador';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/OPR\//i.test(ua)) browser = 'Opera';
  else if(/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) browser = 'Chrome';
  else if(/CriOS/i.test(ua)) browser = 'Chrome iOS';
  else if(/FxiOS/i.test(ua)) browser = 'Firefox iOS';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua)) browser = 'Safari';

  return os + ' · ' + browser;
}

async function detectDevice(){
  let result = null;
  try{
    if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      const hints = await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion']);
      const model = (hints.model || '').trim();
      const platform = (hints.platform || '').trim();
      if(model && model.length > 1){
        result = model + (platform ? ' · '+platform : '');
      } else if(platform){
        const legacyParts = legacyDetect().split(' · ');
        result = legacyParts[1] ? platform + ' · ' + legacyParts[1] : platform;
      }
    }
  }catch(e){ /* sigue al fallback */ }
  if(!result){ result = legacyDetect(); }
  // agrega resolución de pantalla para poder distinguir dispositivos aunque el modelo no esté disponible
  try{
    const w = window.screen && window.screen.width;
    const h = window.screen && window.screen.height;
    if(w && h) result += ' (' + w + '×' + h + ')';
  }catch(e){}
  return result;
}

/* ===================== IDENTIDAD PERSISTENTE DEL DISPOSITIVO ===================== */
function getOrCreateUserId(){
  try{
    let id = localStorage.getItem('cafe_quiz_device_id');
    if(!id){
      id = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem('cafe_quiz_device_id', id);
    }
    return id;
  }catch(e){
    return 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
}

/* ===================== STATE ===================== */
const userId = getOrCreateUserId();
let deviceLabel = 'Detectando dispositivo…';
let joined = false;
let expelled = false;
let record = {id:userId, device:deviceLabel, answers:[]};
let rounds = DEFAULT_ROUNDS;
let currentShuffled = null;
let lastKey = '';
let ui = DEFAULT_UI;

const card = document.getElementById('card');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function saveRecord(){
  db.ref('users/'+userId).set(record).catch(e=>console.error(e));
}

/* ===================== TEXTOS GENERALES ===================== */
db.ref('uitext').on('value', (snap)=>{
  const v = snap.val();
  ui = (v && v.quizVersion === DEFAULT_UI.quizVersion) ? Object.assign({}, DEFAULT_UI, v) : DEFAULT_UI;
  document.getElementById('hero-eyebrow').textContent = ui.heroEyebrow;
  document.getElementById('hero-line1').textContent = ui.heroLine1;
  document.getElementById('hero-line2').textContent = ui.heroLine2;
  document.getElementById('hero-sub').textContent = ui.heroSub;
  document.getElementById('footer-text').textContent = ui.footerText;
  if(!joined) renderLobby();
});

/* ===================== SCREENS ===================== */
function renderLobby(){
  card.innerHTML = `
    <span class="tag">${ui.lobbyTag}</span>
    <p class="body-text">${ui.lobbyText}</p>
    <button class="btn" id="join-btn">${ui.joinBtn}</button>
  `;
  document.getElementById('join-btn').addEventListener('click', async ()=>{
    const btn = document.getElementById('join-btn');
    btn.disabled = true;
    deviceLabel = await detectDevice();
    record.device = deviceLabel;
    joined = true;
    saveRecord();
    watchOwnRecord();
    renderWaiting(ui.waitingStart);
  });
}

function renderWaiting(msg){
  card.innerHTML = `
    <span class="tag">En espera</span>
    <div class="waiting"><div class="dot-pulse"></div><span>${msg}</span></div>
  `;
}

function renderIntro(round){
  const r = rounds[round-1];
  card.innerHTML = `
    <div class="intro-anim">
      <span class="tag">Ronda ${round} de ${rounds.length} · Introducción</span>
      <p class="body-text">${(r && r.intro) || 'La exposición está por comenzar…'}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Esperando la primera pregunta…</span></div>
    </div>
  `;
}

function renderQuestion(state){
  const r = rounds[state.round-1];
  const item = r.questions[state.qIndex];
  const key = 'r'+state.round+'-'+state.qIndex;
  const already = record.answers.find(a=>a.round===state.round && a.qIndex===state.qIndex);

  if(key !== lastKey){
    currentShuffled = shuffle(item.opts);
    lastKey = key;
  }
  const letters = ['A','B','C','D'];

  if(already){
    card.innerHTML = `
      <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta ${state.qIndex+1}</span>
      <p class="q-text">${item.text}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Respuesta guardada. Esperando…</span></div>
    `;
    return;
  }

  card.innerHTML = `
    <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta ${state.qIndex+1}</span>
    <p class="q-text">${item.text}</p>
    <div class="options" id="opts"></div>
  `;
  const wrap = document.getElementById('opts');
  currentShuffled.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">'+letters[idx]+'</span><span>'+opt.t+'</span>';
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#opts .opt').forEach(o=>o.disabled=true);
      btn.classList.add('selected');
      record.answers.push({round:state.round, qIndex:state.qIndex, text:item.text, sel:opt.t, correct:opt.c});
      saveRecord();
      renderWaiting('Respuesta guardada. Esperando la siguiente pregunta…');
    });
    wrap.appendChild(btn);
  });
}

function renderFinal(){
  const all = record.answers;
  const correctCount = all.filter(a=>a.correct).length;
  const total = 8;
  const scoreTen = Math.round((correctCount/total)*10*10)/10;
  let rows = '';
  all.slice().sort((a,b)=> (a.round*10+a.qIndex) - (b.round*10+b.qIndex)).forEach((a,i)=>{
    rows += '<div class="review-item"><div class="qline">'+(i+1)+'. '+a.text+'</div><div class="aline '+(a.correct?'ok':'bad')+'">'+(a.correct?'✓ Correcta':'✗ Incorrecta')+' — tu respuesta: '+a.sel+'</div></div>';
  });
  card.innerHTML = `
    <span class="tag">Resultado final</span>
    <div class="score-big">${scoreTen}</div>
    <div class="score-of">SOBRE 10 · ${correctCount} DE ${total} CORRECTAS</div>
    <div>${rows}</div>
    ${ui.finalExtra ? '<p class="body-text" style="margin-top:20px;">'+ui.finalExtra+'</p>' : ''}
    <p style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:#8b8168; margin-top:26px;">Creado por Juan Pablo Borel</p>
  `;
}

function renderExpelled(){
  card.innerHTML = `
    <div class="expelled-box">
      <div class="big">🚪</div>
      <span class="tag">Fuera del quiz</span>
      <p class="body-text">El administrador te quitó de esta sesión. Si fue un error, pedile que te deje volver a entrar.</p>
    </div>
  `;
}

/* ===================== VIGILAR EL PROPIO REGISTRO (para detectar expulsión) ===================== */
function watchOwnRecord(){
  db.ref('users/'+userId).on('value', (snap)=>{
    if(!joined) return;
    if(snap.val() === null && !expelled){
      expelled = true;
      renderExpelled();
    }
  });
}

/* ===================== RESTAURAR SESIÓN SI YA HABÍA ENTRADO ===================== */
db.ref('users/'+userId).once('value').then(async (snap)=>{
  const existing = snap.val();
  if(existing){
    record = existing;
    if(!record.answers) record.answers = [];
    joined = true;
    // re-detecta el dispositivo por si antes había quedado guardado un valor genérico
    const fresh = await detectDevice();
    if(fresh && fresh !== record.device){
      record.device = fresh;
      saveRecord();
    }
    watchOwnRecord();
  }
});

/* ===================== CONTENIDO ===================== */
db.ref('quizdata').on('value', (snap)=>{
  const val = snap.val();
  const valid = val && val.rounds && val.rounds.length === 8 &&
    val.rounds.every(r => r.questions && r.questions.length === 1);
  if(valid){ rounds = val.rounds; }
});

/* ===================== ESTADO DEL QUIZ EN VIVO ===================== */
db.ref('quizstate').on('value', (snap)=>{
  if(!joined || expelled) return;
  const state = snap.val() || {phase:'lobby'};
  if(state.phase === 'lobby'){
    renderWaiting(ui.waitingStart);
  } else if(state.phase === 'intro'){
    renderIntro(state.round);
  } else if(state.phase === 'question'){
    renderQuestion(state);
  } else if(state.phase === 'finished'){
    renderFinal();
  }
});

renderLobby();
</script>
</body>
</html>
