<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Café · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f4e6cf; --cream-dark:#e8d3ac; --ink:#2b1810; --ink-soft:#5a4030;
    --espresso:#2b1810; --espresso-deep:#180d08; --caramel:#b6733d; --caramel-bright:#d99a52;
    --crema:#8a4a2f; --crema-bright:#a85f3e; --good:#4a7c4e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Spectral',serif; color:var(--ink);
    background: radial-gradient(ellipse at 20% -10%, rgba(182,115,61,.28), transparent 55%),
                radial-gradient(ellipse at 90% 110%, rgba(43,24,16,.4), transparent 50%),
                var(--espresso-deep);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px 80px;
  }
  .stage{width:100%; max-width:640px;}
  .hero{text-align:center; color:var(--cream); padding:6px 6px 28px; animation:dropIn .8s ease both;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{font-family:'JetBrains Mono',monospace; letter-spacing:.3em; font-size:11px; text-transform:uppercase; color:var(--caramel-bright); margin-bottom:8px;}
  .hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(32px,7.6vw,52px); line-height:1.05; margin:0 0 8px;}
  .hero h1 em{font-style:italic; color:var(--caramel-bright);}
  .hero .sub{font-family:'Spectral',serif; font-style:italic; font-size:15px; color:#d9c6ad; max-width:460px; margin:0 auto;}

  .card{
    background:linear-gradient(160deg,var(--cream) 0%,var(--cream-dark) 100%);
    border-radius:6px; box-shadow:0 30px 60px -20px rgba(20,10,4,.45);
    padding:34px 30px 28px; position:relative; animation:riseIn .8s .1s ease both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(43,24,16,.18);border-radius:3px;pointer-events:none;}

  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.15em; color:var(--crema); text-transform:uppercase; display:block; margin-bottom:10px;}
  p.body-text{font-size:16px; line-height:1.65; color:var(--ink-soft); margin:0 0 20px;}
  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    background:var(--crema); color:#fdf3e4; border:none; padding:15px 26px; border-radius:8px; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(138,74,47,.6); transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  .waiting{display:flex; align-items:center; gap:12px; color:var(--ink-soft); font-size:14px;}
  .dot-pulse{width:9px;height:9px;border-radius:50%; background:var(--caramel); animation:pulse 1.2s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  .intro-anim{animation:fadeSlide .6s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .q-text{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(20px,3.4vw,25px); line-height:1.28; margin:0 0 20px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background:rgba(255,250,238,.55); border:1.5px solid rgba(43,24,16,.18);
    border-radius:8px; padding:14px 16px; font-family:'Spectral',serif; font-size:16px; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--caramel); background:rgba(255,250,238,.85); transform:translateX(3px);}
  .opt:disabled{cursor:default;}
  .opt.selected{border-color:var(--espresso); background:rgba(43,24,16,.12);}
  .opt .letter{font-family:'JetBrains Mono',monospace; font-size:12px; width:22px;height:22px;border-radius:50%;
    border:1.5px solid rgba(43,24,16,.3); display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);}
  .opt.selected .letter{background:var(--espresso); border-color:var(--espresso); color:#fff;}

  .score-big{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(60px,14vw,92px); line-height:1; color:var(--espresso); margin:4px 0 0; text-align:center;}
  .score-of{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; text-align:center; display:block; margin-bottom:18px;}
  .review-item{font-size:13px; padding:11px 13px; border-radius:6px; margin-bottom:8px; background:rgba(255,250,238,.5);}
  .review-item .qline{color:var(--ink); margin-bottom:4px;}
  .review-item .aline{font-family:'JetBrains Mono',monospace; font-size:11px;}
  .ok{color:var(--good);} .bad{color:var(--crema-bright);}

  .expelled-box{text-align:center; padding:10px;}
  .expelled-box .big{font-size:40px; margin-bottom:10px;}

  footer.tag2{text-align:center; margin-top:24px; color:#c9ad87; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;}
</style>
</head>
<body>
<div class="stage">
  <div class="hero">
    <div class="eyebrow" id="hero-eyebrow">DE LA CEREZA A LA TAZA</div>
    <h1><span id="hero-line1">¿CUÁNTO SABÉS</span><br><em id="hero-line2">DE CAFÉ?</em></h1>
    <p class="sub" id="hero-sub">Poné a prueba tus conocimientos sobre el origen, las variedades y la preparación del café.</p>
  </div>
  <div class="card" id="card">
    <p class="body-text">Conectando…</p>
  </div>
  <footer class="tag2" id="footer-text">Quiz sobre el café</footer>
</div>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD8kJsBLjZOtq1lSK1fQEKrSXOJH_-A9sY",
  authDomain: "quiz-cafe-e1162.firebaseapp.com",
  databaseURL: "https://quiz-cafe-e1162-default-rtdb.firebaseio.com",
  projectId: "quiz-cafe-e1162",
  storageBucket: "quiz-cafe-e1162.firebasestorage.app",
  messagingSenderId: "16845088970",
  appId: "1:16845088970:web:de67643cd618569991ec33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
/* Prefijo por las dudas reuses este mismo proyecto para otro quiz */
const PREFIX = 'cafe_';

</script>

<script>
/* ===================== CONTENIDO POR DEFECTO (4 rondas x 2 preguntas = 8) ===================== */
const DEFAULT_ROUNDS = [
{intro:"El café tiene su origen en África, en la región de Etiopía. Según la leyenda, un pastor llamado Kaldi notó que sus cabras se ponían muy activas después de comer los frutos rojos de un arbusto silvestre. Al probarlos él mismo, descubrió el efecto estimulante del café.",
 questions:[
  {text:"¿En qué continente se originó el café?",opts:[
    {t:"América",c:false},{t:"África",c:true},{t:"Asia",c:false},{t:"Europa",c:false}]},
  {text:"Según la leyenda, ¿quién descubrió el café al ver a sus cabras eufóricas?",opts:[
    {t:"Un monje",c:false},{t:"Un comerciante",c:false},{t:"Kaldi, un pastor",c:true},{t:"Un rey",c:false}]}
 ]},
{intro:"Existen dos variedades de café que dominan el mercado mundial: el Arábica y el Robusta. El Arábica es más suave y aromático, mientras que el Robusta tiene un sabor más fuerte y amargo, además de mayor contenido de cafeína.",
 questions:[
  {text:"¿Cuáles son las dos variedades de café más cultivadas en el mundo?",opts:[
    {t:"Arábica y Robusta",c:true},{t:"Liberica y Bourbon",c:false},
    {t:"Typica y Caturra",c:false},{t:"Gesha y Maragogipe",c:false}]},
  {text:"¿Cuál de las dos variedades principales tiene más cafeína?",opts:[
    {t:"Arábica",c:false},{t:"Robusta",c:true},{t:"Ambas tienen la misma cantidad",c:false},{t:"Ninguna tiene cafeína",c:false}]}
 ]},
{intro:"El café nace de una fruta llamada cereza de café, dentro de la cual está el grano (la semilla) que después se tuesta. El tueste es un paso clave: transforma los granos verdes en los granos oscuros y aromáticos que conocemos, desarrollando su sabor característico.",
 questions:[
  {text:"¿Qué parte de la planta se usa para hacer café?",opts:[
    {t:"La hoja",c:false},{t:"La raíz",c:false},{t:"El grano dentro de la cereza",c:true},{t:"La flor",c:false}]},
  {text:"¿Qué proceso le da al café su color oscuro y su aroma característico?",opts:[
    {t:"El lavado",c:false},{t:"El tostado",c:true},{t:"El secado al sol",c:false},{t:"La fermentación",c:false}]}
 ]},
{intro:"Brasil es, desde hace más de 150 años, el mayor productor de café del mundo. Y entre los distintos métodos de preparación, el espresso se destaca por usar agua a alta presión para extraer el café de forma rápida y concentrada.",
 questions:[
  {text:"¿Cuál es el mayor productor mundial de café?",opts:[
    {t:"Colombia",c:false},{t:"Brasil",c:true},{t:"Vietnam",c:false},{t:"Etiopía",c:false}]},
  {text:"¿Qué método de preparación usa alta presión para extraer el café rápidamente?",opts:[
    {t:"Prensa francesa",c:false},{t:"Goteo",c:false},{t:"Espresso",c:true},{t:"Café de olla",c:false}]}
 ]}
];

const DEFAULT_UI = {
  heroEyebrow: "DE LA CEREZA A LA TAZA",
  heroLine1: "¿CUÁNTO SABÉS",
  heroLine2: "DE CAFÉ?",
  heroSub: "Poné a prueba tus conocimientos sobre el origen, las variedades y la preparación del café.",
  lobbyTag: "QUIZ DEL CAFÉ",
  lobbyText: "4 rondas · 8 preguntas · 4 opciones por pregunta. Solo una respuesta es correcta. ¿Estás listo?",
  joinBtn: "COMENZAR QUIZ",
  waitingStart: "Preparate. El quiz está por comenzar...",
  footerText: "Quiz sobre el café",
  finalExtra: "Del arbusto a la taza hay un camino largo. ¿Cuánto aprendiste hoy?"
};

/* ===================== DEVICE DETECTION ===================== */
function legacyDetect(){
  const ua = navigator.userAgent || '';
  let os = 'Dispositivo desconocido';
  if(/iPhone/i.test(ua)) os = 'iPhone';
  else if(/iPad/i.test(ua)) os = 'iPad';
  else if(/Android/i.test(ua)){
    const m = ua.match(/Android[^;]*;\s*([^)]+)\)/i);
    let raw = m && m[1] ? m[1].split('Build')[0].trim() : 'Android';
    os = (raw === 'K' || raw.length < 2) ? 'Android' : raw;
  }
  else if(/Macintosh/i.test(ua)) os = 'Mac';
  else if(/Windows/i.test(ua)) os = 'Windows PC';
  else if(/Linux/i.test(ua)) os = 'Linux';

  let browser = 'Navegador';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/OPR\//i.test(ua)) browser = 'Opera';
  else if(/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) browser = 'Chrome';
  else if(/CriOS/i.test(ua)) browser = 'Chrome iOS';
  else if(/FxiOS/i.test(ua)) browser = 'Firefox iOS';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua)) browser = 'Safari';

  return os + ' · ' + browser;
}

async function detectDevice(){
  let result = null;
  try{
    if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      const hints = await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion']);
      const model = (hints.model || '').trim();
      const platform = (hints.platform || '').trim();
      if(model && model.length > 1){
        result = model + (platform ? ' · '+platform : '');
      } else if(platform){
        const legacyParts = legacyDetect().split(' · ');
        result = legacyParts[1] ? platform + ' · ' + legacyParts[1] : platform;
      }
    }
  }catch(e){ /* sigue al fallback */ }
  if(!result){ result = legacyDetect(); }
  try{
    const w = window.screen && window.screen.width;
    const h = window.screen && window.screen.height;
    if(w && h) result += ' (' + w + '×' + h + ')';
  }catch(e){}
  return result;
}

/* ===================== IDENTIDAD PERSISTENTE DEL DISPOSITIVO ===================== */
function getOrCreateUserId(){
  try{
    let id = localStorage.getItem('cafe_device_id');
    if(!id){
      id = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem('cafe_device_id', id);
    }
    return id;
  }catch(e){
    return 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
}

/* ===================== STATE ===================== */
const userId = getOrCreateUserId();
let deviceLabel = 'Detectando dispositivo…';
let joined = false;
let expelled = false;
let record = {id:userId, device:deviceLabel, answers:[]};
let rounds = DEFAULT_ROUNDS;
let currentShuffled = null;
let lastKey = '';
let ui = DEFAULT_UI;

const card = document.getElementById('card');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function saveRecord(){
  db.ref(PREFIX+'users/'+userId).set(record).catch(e=>console.error(e));
}

/* ===================== TEXTOS GENERALES ===================== */
db.ref(PREFIX+'uitext').on('value', (snap)=>{
  const v = snap.val();
  ui = v ? Object.assign({}, DEFAULT_UI, v) : DEFAULT_UI;
  document.getElementById('hero-eyebrow').textContent = ui.heroEyebrow;
  document.getElementById('hero-line1').textContent = ui.heroLine1;
  document.getElementById('hero-line2').textContent = ui.heroLine2;
  document.getElementById('hero-sub').textContent = ui.heroSub;
  document.getElementById('footer-text').textContent = ui.footerText;
  if(!joined) renderLobby();
});

/* ===================== SCREENS ===================== */
function renderLobby(){
  card.innerHTML = `
    <span class="tag">${ui.lobbyTag}</span>
    <p class="body-text">${ui.lobbyText}</p>
    <button class="btn" id="join-btn">${ui.joinBtn}</button>
  `;
  document.getElementById('join-btn').addEventListener('click', async ()=>{
    const btn = document.getElementById('join-btn');
    btn.disabled = true;
    deviceLabel = await detectDevice();
    record.device = deviceLabel;
    joined = true;
    saveRecord();
    watchOwnRecord();
    renderWaiting(ui.waitingStart);
  });
}

function renderWaiting(msg){
  card.innerHTML = `
    <span class="tag">En espera</span>
    <div class="waiting"><div class="dot-pulse"></div><span>${msg}</span></div>
  `;
}

function renderIntro(round){
  const r = rounds[round-1];
  card.innerHTML = `
    <div class="intro-anim">
      <span class="tag">Ronda ${round} de ${rounds.length} · Introducción</span>
      <p class="body-text">${(r && r.intro) || 'Ya casi arrancamos…'}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Esperando la primera pregunta…</span></div>
    </div>
  `;
}

function renderQuestion(state){
  const r = rounds[state.round-1];
  const item = r.questions[state.qIndex];
  const key = 'r'+state.round+'-'+state.qIndex;
  const already = record.answers.find(a=>a.round===state.round && a.qIndex===state.qIndex);

  if(key !== lastKey){
    currentShuffled = shuffle(item.opts);
    lastKey = key;
  }
  const letters = ['A','B','C','D'];

  if(already){
    card.innerHTML = `
      <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta ${state.qIndex+1} de 2</span>
      <p class="q-text">${item.text}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Respuesta guardada. Esperando…</span></div>
    `;
    return;
  }

  card.innerHTML = `
    <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta ${state.qIndex+1} de 2</span>
    <p class="q-text">${item.text}</p>
    <div class="options" id="opts"></div>
  `;
  const wrap = document.getElementById('opts');
  currentShuffled.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">'+letters[idx]+'</span><span>'+opt.t+'</span>';
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#opts .opt').forEach(o=>o.disabled=true);
      btn.classList.add('selected');
      record.answers.push({round:state.round, qIndex:state.qIndex, text:item.text, sel:opt.t, correct:opt.c});
      saveRecord();
      renderWaiting('Respuesta guardada. Esperando la siguiente pregunta…');
    });
    wrap.appendChild(btn);
  });
}

function renderFinal(){
  const all = record.answers;
  const correctCount = all.filter(a=>a.correct).length;
  const total = 8;
  const scoreTen = Math.round((correctCount/total)*10*10)/10;
  let rows = '';
  all.slice().sort((a,b)=> (a.round*10+a.qIndex) - (b.round*10+b.qIndex)).forEach((a,i)=>{
    rows += '<div class="review-item"><div class="qline">'+(i+1)+'. '+a.text+'</div><div class="aline '+(a.correct?'ok':'bad')+'">'+(a.correct?'✓ Correcta':'✗ Incorrecta')+' — tu respuesta: '+a.sel+'</div></div>';
  });
  card.innerHTML = `
    <span class="tag">Resultado final</span>
    <div class="score-big">${scoreTen}</div>
    <div class="score-of">SOBRE 10 · ${correctCount} DE ${total} CORRECTAS</div>
    <div>${rows}</div>
    ${ui.finalExtra ? '<p class="body-text" style="margin-top:20px;">'+ui.finalExtra+'</p>' : ''}
    <p style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:#c9ad87; margin-top:26px;">Creado por Juan Pablo Borel</p>
  `;
}

function renderExpelled(){
  card.innerHTML = `
    <div class="expelled-box">
      <div class="big">☕</div>
      <span class="tag">Fuera del quiz</span>
      <p class="body-text">El administrador te quitó de esta sesión. Si fue un error, pedile que te deje volver a entrar.</p>
    </div>
  `;
}

/* ===================== VIGILAR EL PROPIO REGISTRO (para detectar expulsión) ===================== */
function watchOwnRecord(){
  db.ref(PREFIX+'users/'+userId).on('value', (snap)=>{
    if(!joined) return;
    if(snap.val() === null && !expelled){
      expelled = true;
      renderExpelled();
    }
  });
}

/* ===================== RESTAURAR SESIÓN SI YA HABÍA ENTRADO ===================== */
db.ref(PREFIX+'users/'+userId).once('value').then(async (snap)=>{
  const existing = snap.val();
  if(existing){
    record = existing;
    if(!record.answers) record.answers = [];
    joined = true;
    const fresh = await detectDevice();
    if(fresh && fresh !== record.device){
      record.device = fresh;
      saveRecord();
    }
    watchOwnRecord();
  }
});

/* ===================== CONTENIDO ===================== */
db.ref(PREFIX+'quizdata').on('value', (snap)=>{
  const val = snap.val();
  if(val && val.rounds && val.rounds.length){ rounds = val.rounds; }
});

/* ===================== ESTADO DEL QUIZ EN VIVO ===================== */
db.ref(PREFIX+'quizstate').on('value', (snap)=>{
  if(!joined || expelled) return;
  const state = snap.val() || {phase:'lobby'};
  if(state.phase === 'lobby'){
    renderWaiting(ui.waitingStart);
  } else if(state.phase === 'intro'){
    renderIntro(state.round);
  } else if(state.phase === 'question'){
    renderQuestion(state);
  } else if(state.phase === 'finished'){
    renderFinal();
  }
});

renderLobby();
</script>
</body>
</html>
