<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Historia del Café · Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#ece0c8; --cream-dark:#ddc9a3; --ink:#2a1a10; --ink-soft:#4a3324;
    --coffee:#2c1810; --coffee-deep:#170d08; --gold:#b8823f; --gold-bright:#e0aa52;
    --roast:#7a4326; --roast-bright:#a2582f; --good:#2f6e4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; font-family:'Spectral',serif; color:var(--ink);
    background: radial-gradient(ellipse at 20% -10%, rgba(184,130,63,.25), transparent 55%),
                radial-gradient(ellipse at 90% 110%, rgba(44,24,16,.45), transparent 50%),
                var(--coffee-deep);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px 80px;
  }
  .stage{width:100%; max-width:640px;}
  .hero{text-align:center; color:var(--cream); padding:6px 6px 28px; animation:dropIn .8s ease both;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  .eyebrow{font-family:'JetBrains Mono',monospace; letter-spacing:.3em; font-size:11px; text-transform:uppercase; color:var(--gold-bright); margin-bottom:8px;}
  .hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(32px,7.6vw,52px); line-height:1.05; margin:0 0 8px;}
  .hero h1 em{font-style:italic; color:var(--gold-bright);}
  .hero .sub{font-family:'Spectral',serif; font-style:italic; font-size:15px; color:#d8cbb0; max-width:460px; margin:0 auto;}

  .card{
    background:linear-gradient(160deg,var(--cream) 0%,var(--cream-dark) 100%);
    border-radius:6px; box-shadow:0 30px 60px -20px rgba(20,14,6,.35);
    padding:34px 30px 28px; position:relative; animation:riseIn .8s .1s ease both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(42,26,16,.18);border-radius:3px;pointer-events:none;}

  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.15em; color:var(--roast); text-transform:uppercase; display:block; margin-bottom:10px;}
  p.body-text{font-size:16px; line-height:1.65; color:var(--ink-soft); margin:0 0 20px;}
  .btn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; letter-spacing:.14em; text-transform:uppercase;
    background:var(--roast); color:#fdf3e4; border:none; padding:15px 26px; border-radius:8px; cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(122,67,38,.6); transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

  .waiting{display:flex; align-items:center; gap:12px; color:var(--ink-soft); font-size:14px;}
  .dot-pulse{width:9px;height:9px;border-radius:50%; background:var(--gold); animation:pulse 1.2s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  .intro-anim{animation:fadeSlide .6s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .q-text{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(20px,3.4vw,25px); line-height:1.28; margin:0 0 20px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; background:rgba(255,250,240,.55); border:1.5px solid rgba(42,26,16,.18);
    border-radius:8px; padding:14px 16px; font-family:'Spectral',serif; font-size:16px; color:var(--ink);
    cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .15s ease; width:100%;
  }
  .opt:hover:not(:disabled){border-color:var(--gold); background:rgba(255,250,240,.85); transform:translateX(3px);}
  .opt:disabled{cursor:default;}
  .opt.selected{border-color:var(--coffee); background:rgba(44,24,16,.12);}
  .opt .letter{font-family:'JetBrains Mono',monospace; font-size:12px; width:22px;height:22px;border-radius:50%;
    border:1.5px solid rgba(42,26,16,.3); display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-soft);}
  .opt.selected .letter{background:var(--coffee); border-color:var(--coffee); color:#fff;}

  .score-big{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:clamp(60px,14vw,92px); line-height:1; color:var(--coffee); margin:4px 0 0; text-align:center;}
  .score-of{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; text-align:center; display:block; margin-bottom:18px;}
  .review-item{font-size:13px; padding:11px 13px; border-radius:6px; margin-bottom:8px; background:rgba(255,250,240,.5);}
  .review-item .qline{color:var(--ink); margin-bottom:4px;}
  .review-item .aline{font-family:'JetBrains Mono',monospace; font-size:11px;}
  .ok{color:var(--good);} .bad{color:#a2402f;}

  .expelled-box{text-align:center; padding:10px;}
  .expelled-box .big{font-size:40px; margin-bottom:10px;}

  footer.tag2{text-align:center; margin-top:24px; color:#a3937a; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;}
</style>

<script>
/* ===================== CONTENIDO POR DEFECTO (8 rondas x 1 pregunta) ===================== */
const DEFAULT_ROUNDS = [
{intro:"La leyenda más famosa sobre el origen del café cuenta que un pastor de cabras llamado Kaldi, en Etiopía, notó que sus cabras se ponían muy activas después de comer los frutos rojos de un arbusto. Al probarlos él mismo, sintió el mismo efecto. Este episodio, ocurrido alrededor del siglo IX, es considerado el mito fundacional del descubrimiento del café.",
 question:{text:"Según la leyenda, ¿quién descubrió el efecto del café al observar a sus cabras?",opts:[
   {t:"Un monje etíope",c:false},{t:"Un pastor llamado Kaldi",c:true},
   {t:"Un mercader árabe",c:false},{t:"Un explorador portugués",c:false}]}},

{intro:"Desde Etiopía, el consumo de café se extendió a la península arábiga. Fue en Yemen, durante el siglo XV, donde el café comenzó a cultivarse de forma organizada y donde monjes sufíes lo usaban para mantenerse despiertos durante las oraciones nocturnas. El puerto de Moca se convirtió en el principal punto de exportación, dando origen al nombre de una variedad de café.",
 question:{text:"¿En qué país se organizó por primera vez el cultivo del café?",opts:[
   {t:"Yemen",c:true},{t:"Turquía",c:false},{t:"Brasil",c:false},{t:"Etiopía",c:false}]}},

{intro:"Durante el siglo XVI, el café llegó a las grandes ciudades del Imperio Otomano, como Estambul, donde surgieron las primeras casas de café o 'qahveh khaneh'. Estos lugares se convirtieron en centros sociales donde la gente se reunía a conversar, jugar ajedrez y escuchar música, por lo que también se los llamó 'escuelas de los sabios'.",
 question:{text:"¿Cómo se llamaban las primeras casas de café en el Imperio Otomano?",opts:[
   {t:"Coffee houses",c:false},{t:"Qahveh khaneh",c:true},
   {t:"Cafés parisinos",c:false},{t:"Tabernas otomanas",c:false}]}},

{intro:"El café llegó a Europa a principios del siglo XVII a través de comerciantes venecianos. En un principio generó desconfianza, e incluso algunos lo llamaban 'la bebida amarga de Satanás'. Se cuenta que el Papa Clemente VIII lo probó y, lejos de condenarlo, lo aprobó, lo que ayudó a que se popularizara entre los cristianos europeos.",
 question:{text:"¿A través de qué comerciantes llegó el café a Europa?",opts:[
   {t:"Comerciantes venecianos",c:true},{t:"Comerciantes ingleses",c:false},
   {t:"Comerciantes holandeses",c:false},{t:"Comerciantes españoles",c:false}]}},

{intro:"En 1652 abrió en Londres la primera casa de café de Inglaterra. Estos locales se multiplicaron rápidamente y se convirtieron en espacios de debate político, literario y comercial, tan influyentes que se los llamó 'universidades de un penique', ya que por esa moneda se podía entrar y participar de las conversaciones. Algunas compañías importantes, como Lloyd's de Londres, nacieron dentro de una casa de café.",
 question:{text:"¿Por qué se llamaba a las casas de café inglesas 'universidades de un penique'?",opts:[
   {t:"Porque enseñaban a preparar café",c:false},{t:"Porque con una moneda se podía entrar y debatir ideas",c:true},
   {t:"Porque eran gratuitas para estudiantes",c:false},{t:"Porque el café costaba un penique la taza",c:false}]}},

{intro:"Los holandeses fueron los primeros europeos en cultivar café fuera de Arabia, llevando plantas a sus colonias en Indonesia (Java) a fines del siglo XVII. Poco después, Francia también comenzó a cultivar café en sus colonias del Caribe. La leyenda cuenta que el oficial naval Gabriel de Clieu llevó una planta de café hasta Martinica en 1723, cruzando el Atlántico y compartiendo su ración de agua con la planta durante el viaje.",
 question:{text:"¿Qué colonia holandesa se convirtió en un importante centro de cultivo de café?",opts:[
   {t:"Java (Indonesia)",c:true},{t:"Martinica",c:false},{t:"Brasil",c:false},{t:"Ceilán",c:false}]}},

{intro:"El café llegó a Brasil en 1727, y con el paso de las décadas ese país se convirtió en el mayor productor mundial, posición que mantiene hasta hoy. El clima y el suelo de regiones como San Pablo y Minas Gerais resultaron ideales para su cultivo. Durante el siglo XIX y XX, el café fue central en la economía brasileña, al punto de ser llamado 'oro verde'.",
 question:{text:"¿Cuál es el mayor productor mundial de café en la actualidad?",opts:[
   {t:"Colombia",c:false},{t:"Vietnam",c:false},{t:"Brasil",c:true},{t:"Etiopía",c:false}]}},

{intro:"En el siglo XX, la forma de preparar y consumir café cambió radicalmente con la invención del café instantáneo y, más tarde, de las máquinas de espresso italianas. En 1901, el químico Satori Kato desarrolló uno de los primeros procesos de café soluble, y en 1938 Nestlé lanzó Nescafé. Desde entonces, el café se convirtió en una de las bebidas más consumidas del planeta.",
 question:{text:"¿Qué marca lanzó el café instantáneo Nescafé en 1938?",opts:[
   {t:"Starbucks",c:false},{t:"Nestlé",c:true},{t:"Lavazza",c:false},{t:"Folgers",c:false}]}}
];

const DEFAULT_UI = {
  heroEyebrow: "HISTORIA DEL CAFÉ",
  heroLine1: "¿CUÁNTO SABÉS",
  heroLine2: "DE CAFÉ?",
  heroSub: "Poné a prueba tus conocimientos sobre el origen y la historia del café en el mundo.",
  lobbyTag: "QUIZ HISTÓRICO",
  lobbyText: "8 rondas · 8 preguntas · 4 opciones por pregunta. Solo una respuesta es correcta. ¿Estás listo para poner a prueba cuánto sabés sobre el café?",
  joinBtn: "COMENZAR QUIZ",
  waitingStart: "Prepará tus conocimientos. El quiz está por comenzar...",
  footerText: "Quiz sobre la Historia del Café",
  finalExtra: "Del arbusto etíope a la taza que tenés cada mañana: el café recorrió siglos y continentes. ¿Cuánto aprendiste?"
};

/* ===================== DEVICE DETECTION ===================== */
function legacyDetect(){
  const ua = navigator.userAgent || '';
  let os = 'Dispositivo desconocido';
  if(/iPhone/i.test(ua)) os = 'iPhone';
  else if(/iPad/i.test(ua)) os = 'iPad';
  else if(/Android/i.test(ua)){
    const m = ua.match(/Android[^;]*;\s*([^)]+)\)/i);
    let raw = m && m[1] ? m[1].split('Build')[0].trim() : 'Android';
    os = (raw === 'K' || raw.length < 2) ? 'Android' : raw;
  }
  else if(/Macintosh/i.test(ua)) os = 'Mac';
  else if(/Windows/i.test(ua)) os = 'Windows PC';
  else if(/Linux/i.test(ua)) os = 'Linux';

  let browser = 'Navegador';
  if(/Edg\//i.test(ua)) browser = 'Edge';
  else if(/OPR\//i.test(ua)) browser = 'Opera';
  else if(/Chrome\//i.test(ua) && !/Chromium/i.test(ua)) browser = 'Chrome';
  else if(/CriOS/i.test(ua)) browser = 'Chrome iOS';
  else if(/FxiOS/i.test(ua)) browser = 'Firefox iOS';
  else if(/Firefox\//i.test(ua)) browser = 'Firefox';
  else if(/Safari\//i.test(ua)) browser = 'Safari';

  return os + ' · ' + browser;
}

async function detectDevice(){
  let result = null;
  try{
    if(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      const hints = await navigator.userAgentData.getHighEntropyValues(['model','platform','platformVersion']);
      const model = (hints.model || '').trim();
      const platform = (hints.platform || '').trim();
      if(model && model.length > 1){
        result = model + (platform ? ' · '+platform : '');
      } else if(platform){
        const legacyParts = legacyDetect().split(' · ');
        result = legacyParts[1] ? platform + ' · ' + legacyParts[1] : platform;
      }
    }
  }catch(e){ /* sigue al fallback */ }
  if(!result){ result = legacyDetect(); }
  try{
    const w = window.screen && window.screen.width;
    const h = window.screen && window.screen.height;
    if(w && h) result += ' (' + w + '×' + h + ')';
  }catch(e){}
  return result;
}

/* ===================== IDENTIDAD PERSISTENTE DEL DISPOSITIVO ===================== */
function getOrCreateUserId(){
  try{
    let id = localStorage.getItem('cafe_quiz_device_id');
    if(!id){
      id = 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
      localStorage.setItem('cafe_quiz_device_id', id);
    }
    return id;
  }catch(e){
    return 'u' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }
}

/* ===================== ESTADO ===================== */
const userId = getOrCreateUserId();
let deviceLabel = 'Detectando dispositivo…';
let joined = false;
let expelled = false;
let record = {id:userId, name:'', device:deviceLabel, answers:[]};
let rounds = DEFAULT_ROUNDS;
let currentShuffled = null;
let lastKey = '';
let ui = DEFAULT_UI;
let lastPhaseKey = '';

const card = document.getElementById('card');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function saveRecord(){
  db.ref('users/'+userId).set(record).catch(e=>console.error(e));
}

/* ===================== TEXTOS GENERALES ===================== */
db.ref('uitext').on('value', (snap)=>{
  const v = snap.val();
  ui = v ? Object.assign({}, DEFAULT_UI, v) : DEFAULT_UI;
  document.getElementById('hero-eyebrow').textContent = ui.heroEyebrow;
  document.getElementById('hero-line1').textContent = ui.heroLine1;
  document.getElementById('hero-line2').textContent = ui.heroLine2;
  document.getElementById('hero-sub').textContent = ui.heroSub;
  document.getElementById('footer-text').textContent = ui.footerText;
  if(!joined) renderLobby();
});

/* ===================== PANTALLAS ===================== */
function renderLobby(){
  card.innerHTML = `
    <span class="tag">${ui.lobbyTag}</span>
    <p class="body-text">${ui.lobbyText}</p>
    <div style="margin-bottom:14px;">
      <input id="name-input" type="text" placeholder="Tu nombre" maxlength="30"
        style="width:100%; padding:12px 14px; border-radius:8px; border:1.5px solid rgba(42,26,16,.25); font-family:'Spectral',serif; font-size:15px; background:rgba(255,250,240,.6);">
    </div>
    <button class="btn" id="join-btn">${ui.joinBtn}</button>
  `;
  document.getElementById('join-btn').addEventListener('click', async ()=>{
    const btn = document.getElementById('join-btn');
    const nameInput = document.getElementById('name-input');
    const name = (nameInput.value || '').trim() || 'Anónimo';
    btn.disabled = true;
    deviceLabel = await detectDevice();
    record.device = deviceLabel;
    record.name = name;
    joined = true;
    saveRecord();
    watchOwnRecord();
    renderWaiting(ui.waitingStart);
  });
}

function renderWaiting(msg){
  card.innerHTML = `
    <span class="tag">En espera</span>
    <div class="waiting"><div class="dot-pulse"></div><span>${msg}</span></div>
  `;
}

function renderIntro(round){
  const r = rounds[round-1];
  card.innerHTML = `
    <div class="intro-anim">
      <span class="tag">Ronda ${round} de ${rounds.length} · Introducción</span>
      <p class="body-text">${(r && r.intro) || 'La historia está por continuar…'}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Esperando la pregunta…</span></div>
    </div>
  `;
}

function renderQuestion(state){
  const r = rounds[state.round-1];
  const item = r.question;
  const key = 'r'+state.round;
  const already = record.answers.find(a=>a.round===state.round);

  if(key !== lastKey){
    currentShuffled = shuffle(item.opts);
    lastKey = key;
  }
  const letters = ['A','B','C','D'];

  if(already){
    card.innerHTML = `
      <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta</span>
      <p class="q-text">${item.text}</p>
      <div class="waiting"><div class="dot-pulse"></div><span>Respuesta guardada. Esperando…</span></div>
    `;
    return;
  }

  card.innerHTML = `
    <span class="tag">Ronda ${state.round} de ${rounds.length} · Pregunta</span>
    <p class="q-text">${item.text}</p>
    <div class="options" id="opts"></div>
  `;
  const wrap = document.getElementById('opts');
  currentShuffled.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">'+letters[idx]+'</span><span>'+opt.t+'</span>';
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#opts .opt').forEach(o=>o.disabled=true);
      btn.classList.add('selected');
      record.answers.push({round:state.round, text:item.text, sel:opt.t, correct:opt.c});
      saveRecord();
      renderWaiting('Respuesta guardada. Esperando la siguiente ronda…');
    });
    wrap.appendChild(btn);
  });
}

function renderFinal(){
  const all = record.answers;
  const correctCount = all.filter(a=>a.correct).length;
  const total = rounds.length;
  const scoreTen = Math.round((correctCount/total)*10*10)/10;
  let rows = '';
  all.slice().sort((a,b)=> a.round - b.round).forEach((a,i)=>{
    rows += '<div class="review-item"><div class="qline">'+(i+1)+'. '+a.text+'</div><div class="aline '+(a.correct?'ok':'bad')+'">'+(a.correct?'✓ Correcta':'✗ Incorrecta')+' — tu respuesta: '+a.sel+'</div></div>';
  });
  card.innerHTML = `
    <span class="tag">Resultado final</span>
    <div class="score-big">${scoreTen}</div>
    <div class="score-of">SOBRE 10 · ${correctCount} DE ${total} CORRECTAS</div>
    <div>${rows}</div>
    ${ui.finalExtra ? '<p class="body-text" style="margin-top:20px;">'+ui.finalExtra+'</p>' : ''}
  `;
}

function renderExpelled(){
  card.innerHTML = `
    <div class="expelled-box">
      <div class="big">🚪</div>
      <span class="tag">Fuera del quiz</span>
      <p class="body-text">El administrador te quitó de esta sesión. Si fue un error, pedile que te deje volver a entrar.</p>
    </div>
  `;
}

/* ===================== VIGILAR EL PROPIO REGISTRO (detectar expulsión) ===================== */
function watchOwnRecord(){
  db.ref('users/'+userId).on('value', (snap)=>{
    if(!joined) return;
    if(snap.val() === null && !expelled){
      expelled = true;
      renderExpelled();
    }
  });
}

/* ===================== RESTAURAR SESIÓN ===================== */
db.ref('users/'+userId).once('value').then(async (snap)=>{
  const existing = snap.val();
  if(existing){
    record = existing;
    if(!record.answers) record.answers = [];
    joined = true;
    const fresh = await detectDevice();
    if(fresh && fresh !== record.device){
      record.device = fresh;
      saveRecord();
    }
    watchOwnRecord();
  }
});

/* ===================== CONTENIDO ===================== */
db.ref('quizdata').on('value', (snap)=>{
  const val = snap.val();
  if(val && val.rounds && val.rounds.length){ rounds = val.rounds; }
});

/* ===================== ESTADO DEL QUIZ EN VIVO ===================== */
db.ref('quizstate').on('value', (snap)=>{
  if(!joined || expelled) return;
  const state = snap.val() || {phase:'lobby'};
  const phaseKey = state.phase + '-' + (state.round||0) + '-' + (state.resetToken||0);
  if(state.resetToken && state.resetToken !== window._lastResetToken){
    window._lastResetToken = state.resetToken;
    record.answers = [];
    saveRecord();
  }
  lastPhaseKey = phaseKey;
  if(state.phase === 'lobby'){
    renderWaiting(ui.waitingStart);
  } else if(state.phase === 'intro'){
    renderIntro(state.round);
  } else if(state.phase === 'question'){
    renderQuestion(state);
  } else if(state.phase === 'finished'){
    renderFinal();
  }
});
