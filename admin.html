<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Historia del Café</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#ece0c8; --ink:#2a1a10; --ink-soft:#4a3324;
    --coffee:#2c1810; --coffee-deep:#170d08; --gold:#b8823f; --gold-bright:#e0aa52;
    --roast:#7a4326; --panel:#211208; --panel2:#2c1a0e; --good:#2f6e4f; --bad:#a2402f; --line:rgba(224,170,82,.18);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Spectral',serif; background:var(--coffee-deep); color:var(--cream); min-height:100vh;}
  header{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  header h1{font-family:'Cormorant Garamond',serif; font-size:24px; margin:0; color:var(--gold-bright);}
  header .sub{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#a3937a; text-transform:uppercase;}
  .layout{display:grid; grid-template-columns: 340px 1fr; gap:0;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }
  .col{padding:20px;}
  .col-left{border-right:1px solid var(--line);}
  section{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 16px 18px; margin-bottom:16px;}
  section h2{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--gold-bright); margin:0 0 12px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .btn{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--roast); color:#fdf3e4; border:none; padding:10px 14px; border-radius:7px; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn.secondary{background:var(--panel2); border:1px solid var(--line);}
  .btn.danger{background:var(--bad);}
  .btn.good{background:var(--good);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.small{padding:6px 10px; font-size:10.5px;}
  input, textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--cream);
    border-radius:6px; padding:8px 10px; font-family:'Spectral',serif; font-size:14px; margin-bottom:8px;
  }
  textarea{resize:vertical; min-height:60px;}
  label{display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#a3937a; margin-bottom:4px;}
  .status-pill{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 10px; border-radius:20px; background:var(--panel2); border:1px solid var(--line); color:var(--gold-bright);}
  .user-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px; border-radius:7px; background:var(--panel2); margin-bottom:8px;}
  .user-item .name{font-weight:600; font-size:14px;}
  .user-item .meta{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#a3937a;}
  .user-item .score{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-bright);}
  .round-block{border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--panel2);}
  .round-block h3{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-bright); margin:0 0 8px; display:flex; justify-content:space-between; align-items:center;}
  .opt-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .opt-row input[type=text]{margin-bottom:0;}
  .opt-row input[type=radio]{width:auto; margin:0;}
  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{padding:8px 14px; border-radius:7px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#a3937a;}
  .tab.active{background:var(--roast); color:#fdf3e4;}
  .save-note{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--good); margin-top:6px; min-height:14px;}
  .empty{color:#a3937a; font-size:13px; text-align:center; padding:10px;}
</style>
</head>
<body>

<header>
  <div>
    <h1>☕ Admin · Historia del Café</h1>
    <div class="sub">Panel de control en vivo</div>
  </div>
  <div class="status-pill" id="state-pill">Cargando estado…</div>
</header>

<div class="layout">
  <!-- ===================== COLUMNA IZQUIERDA: CONTROL + USUARIOS ===================== -->
  <div class="col col-left">
    <section>
      <h2>Control del quiz</h2>
      <div class="row">
        <button class="btn secondary" id="btn-lobby">Volver a lobby</button>
        <button class="btn danger" id="btn-reset">Reiniciar quiz (todos)</button>
        <button class="btn good" id="btn-finish">Finalizar quiz</button>
      </div>
      <div id="round-controls"></div>
    </section>

    <section>
      <h2>Jugadores conectados (<span id="user-count">0</span>)</h2>
      <div id="user-list"><div class="empty">Nadie se conectó todavía.</div></div>
    </section>
  </div>

  <!-- ===================== COLUMNA DERECHA: EDICIÓN DE CONTENIDO ===================== -->
  <div class="col">
    <div class="tabs">
      <div class="tab active" data-tab="general">Textos generales</div>
      <div class="tab" data-tab="rounds">Rondas y preguntas</div>
    </div>

    <div id="tab-general">
      <section>
        <h2>Textos de la portada</h2>
        <label>Eyebrow (arriba del título)</label>
        <input type="text" id="ui-heroEyebrow">
        <label>Título línea 1</label>
        <input type="text" id="ui-heroLine1">
        <label>Título línea 2 (cursiva)</label>
        <input type="text" id="ui-heroLine2">
        <label>Subtítulo</label>
        <textarea id="ui-heroSub"></textarea>
        <label>Texto del footer</label>
        <input type="text" id="ui-footerText">
      </section>
      <section>
        <h2>Pantalla de inicio (lobby)</h2>
        <label>Etiqueta</label>
        <input type="text" id="ui-lobbyTag">
        <label>Texto de bienvenida</label>
        <textarea id="ui-lobbyText"></textarea>
        <label>Texto del botón</label>
        <input type="text" id="ui-joinBtn">
        <label>Mensaje "esperando inicio"</label>
        <input type="text" id="ui-waitingStart">
      </section>
      <section>
        <h2>Pantalla final</h2>
        <label>Texto extra al final del quiz</label>
        <textarea id="ui-finalExtra"></textarea>
      </section>
      <button class="btn" id="save-ui">Guardar textos generales</button>
      <div class="save-note" id="save-ui-note"></div>
    </div>

    <div id="tab-rounds" style="display:none;">
      <div id="rounds-editor"></div>
      <button class="btn" id="save-rounds">Guardar todas las rondas</button>
      <div class="save-note" id="save-rounds-note"></div>
    </div>
  </div>
</div>

<!-- ============ FIREBASE ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ⚠️ Usá la MISMA configuración de Firebase que en quiz.html (mismo proyecto). */
const firebaseConfig = {
  apiKey: "AIzaSyA0FwDyU5FIvwd9w-HcYX-RJImuNkhrK6o",
  authDomain: "cafe-polaco.firebaseapp.com",
  databaseURL: "https://cafe-polaco-default-rtdb.firebaseio.com",
  projectId: "cafe-polaco",
  storageBucket: "cafe-polaco.firebasestorage.app",
  messagingSenderId: "497348542143",
  appId: "1:497348542143:web:f26f1a7c4c4daa839b500a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
/* ===================== DEFAULTS (deben coincidir con quiz.html) ===================== */
const DEFAULT_ROUNDS = [
{intro:"La leyenda más famosa sobre el origen del café cuenta que un pastor de cabras llamado Kaldi, en Etiopía, notó que sus cabras se ponían muy activas después de comer los frutos rojos de un arbusto. Al probarlos él mismo, sintió el mismo efecto. Este episodio, ocurrido alrededor del siglo IX, es considerado el mito fundacional del descubrimiento del café.",
 question:{text:"Según la leyenda, ¿quién descubrió el efecto del café al observar a sus cabras?",opts:[
   {t:"Un monje etíope",c:false},{t:"Un pastor llamado Kaldi",c:true},
   {t:"Un mercader árabe",c:false},{t:"Un explorador portugués",c:false}]}},
{intro:"Desde Etiopía, el consumo de café se extendió a la península arábiga. Fue en Yemen, durante el siglo XV, donde el café comenzó a cultivarse de forma organizada y donde monjes sufíes lo usaban para mantenerse despiertos durante las oraciones nocturnas. El puerto de Moca se convirtió en el principal punto de exportación, dando origen al nombre de una variedad de café.",
 question:{text:"¿En qué país se organizó por primera vez el cultivo del café?",opts:[
   {t:"Yemen",c:true},{t:"Turquía",c:false},{t:"Brasil",c:false},{t:"Etiopía",c:false}]}},
{intro:"Durante el siglo XVI, el café llegó a las grandes ciudades del Imperio Otomano, como Estambul, donde surgieron las primeras casas de café o 'qahveh khaneh'. Estos lugares se convirtieron en centros sociales donde la gente se reunía a conversar, jugar ajedrez y escuchar música, por lo que también se los llamó 'escuelas de los sabios'.",
 question:{text:"¿Cómo se llamaban las primeras casas de café en el Imperio Otomano?",opts:[
   {t:"Coffee houses",c:false},{t:"Qahveh khaneh",c:true},
   {t:"Cafés parisinos",c:false},{t:"Tabernas otomanas",c:false}]}},
{intro:"El café llegó a Europa a principios del siglo XVII a través de comerciantes venecianos. En un principio generó desconfianza, e incluso algunos lo llamaban 'la bebida amarga de Satanás'. Se cuenta que el Papa Clemente VIII lo probó y, lejos de condenarlo, lo aprobó, lo que ayudó a que se popularizara entre los cristianos europeos.",
 question:{text:"¿A través de qué comerciantes llegó el café a Europa?",opts:[
   {t:"Comerciantes venecianos",c:true},{t:"Comerciantes ingleses",c:false},
   {t:"Comerciantes holandeses",c:false},{t:"Comerciantes españoles",c:false}]}},
{intro:"En 1652 abrió en Londres la primera casa de café de Inglaterra. Estos locales se multiplicaron rápidamente y se convirtieron en espacios de debate político, literario y comercial, tan influyentes que se los llamó 'universidades de un penique', ya que por esa moneda se podía entrar y participar de las conversaciones. Algunas compañías importantes, como Lloyd's de Londres, nacieron dentro de una casa de café.",
 question:{text:"¿Por qué se llamaba a las casas de café inglesas 'universidades de un penique'?",opts:[
   {t:"Porque enseñaban a preparar café",c:false},{t:"Porque con una moneda se podía entrar y debatir ideas",c:true},
   {t:"Porque eran gratuitas para estudiantes",c:false},{t:"Porque el café costaba un penique la taza",c:false}]}},
{intro:"Los holandeses fueron los primeros europeos en cultivar café fuera de Arabia, llevando plantas a sus colonias en Indonesia (Java) a fines del siglo XVII. Poco después, Francia también comenzó a cultivar café en sus colonias del Caribe. La leyenda cuenta que el oficial naval Gabriel de Clieu llevó una planta de café hasta Martinica en 1723, cruzando el Atlántico y compartiendo su ración de agua con la planta durante el viaje.",
 question:{text:"¿Qué colonia holandesa se convirtió en un importante centro de cultivo de café?",opts:[
   {t:"Java (Indonesia)",c:true},{t:"Martinica",c:false},{t:"Brasil",c:false},{t:"Ceilán",c:false}]}},
{intro:"El café llegó a Brasil en 1727, y con el paso de las décadas ese país se convirtió en el mayor productor mundial, posición que mantiene hasta hoy. El clima y el suelo de regiones como San Pablo y Minas Gerais resultaron ideales para su cultivo. Durante el siglo XIX y XX, el café fue central en la economía brasileña, al punto de ser llamado 'oro verde'.",
 question:{text:"¿Cuál es el mayor productor mundial de café en la actualidad?",opts:[
   {t:"Colombia",c:false},{t:"Vietnam",c:false},{t:"Brasil",c:true},{t:"Etiopía",c:false}]}},
{intro:"En el siglo XX, la forma de preparar y consumir café cambió radicalmente con la invención del café instantáneo y, más tarde, de las máquinas de espresso italianas. En 1901, el químico Satori Kato desarrolló uno de los primeros procesos de café soluble, y en 1938 Nestlé lanzó Nescafé. Desde entonces, el café se convirtió en una de las bebidas más consumidas del planeta.",
 question:{text:"¿Qué marca lanzó el café instantáneo Nescafé en 1938?",opts:[
   {t:"Starbucks",c:false},{t:"Nestlé",c:true},{t:"Lavazza",c:false},{t:"Folgers",c:false}]}}
];

const DEFAULT_UI = {
  heroEyebrow: "HISTORIA DEL CAFÉ",
  heroLine1: "¿CUÁNTO SABÉS",
  heroLine2: "DE CAFÉ?",
  heroSub: "Poné a prueba tus conocimientos sobre el origen y la historia del café en el mundo.",
  lobbyTag: "QUIZ HISTÓRICO",
  lobbyText: "8 rondas · 8 preguntas · 4 opciones por pregunta. Solo una respuesta es correcta. ¿Estás listo para poner a prueba cuánto sabés sobre el café?",
  joinBtn: "COMENZAR QUIZ",
  waitingStart: "Prepará tus conocimientos. El quiz está por comenzar...",
  footerText: "Quiz sobre la Historia del Café",
  finalExtra: "Del arbusto etíope a la taza que tenés cada mañana: el café recorrió siglos y continentes. ¿Cuánto aprendiste?"
};

let ui = DEFAULT_UI;
let rounds = DEFAULT_ROUNDS;
let quizstate = {phase:'lobby', round:1};
let users = {};

/* ===================== TABS ===================== */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-general').style.display = tab.dataset.tab==='general' ? 'block' : 'none';
    document.getElementById('tab-rounds').style.display = tab.dataset.tab==='rounds' ? 'block' : 'none';
  });
});

/* ===================== CARGA DE TEXTOS GENERALES ===================== */
db.ref('uitext').on('value', (snap)=>{
  const v = snap.val();
  ui = v ? Object.assign({}, DEFAULT_UI, v) : DEFAULT_UI;
  Object.keys(DEFAULT_UI).forEach(k=>{
    const el = document.getElementById('ui-'+k);
    if(el) el.value = ui[k];
  });
});

document.getElementById('save-ui').addEventListener('click', ()=>{
  const newUi = {};
  Object.keys(DEFAULT_UI).forEach(k=>{
    const el = document.getElementById('ui-'+k);
    newUi[k] = el ? el.value : DEFAULT_UI[k];
  });
  db.ref('uitext').set(newUi).then(()=>{
    const note = document.getElementById('save-ui-note');
    note.textContent = '✓ Guardado — se actualizó en vivo para todos.';
    setTimeout(()=>note.textContent='', 3000);
  });
});

/* ===================== CARGA DE RONDAS ===================== */
db.ref('quizdata').on('value', (snap)=>{
  const val = snap.val();
  rounds = (val && val.rounds && val.rounds.length) ? val.rounds : DEFAULT_ROUNDS;
  renderRoundsEditor();
  renderRoundControls();
});

function renderRoundsEditor(){
  const wrap = document.getElementById('rounds-editor');
  wrap.innerHTML = '';
  rounds.forEach((r, ri)=>{
    const block = document.createElement('div');
    block.className = 'round-block';
    const letters = ['A','B','C','D'];
    block.innerHTML = `
      <h3>Ronda ${ri+1}</h3>
      <label>Texto de introducción</label>
      <textarea data-r="${ri}" data-f="intro">${r.intro||''}</textarea>
      <label>Texto de la pregunta</label>
      <input type="text" data-r="${ri}" data-f="qtext" value="${(r.question.text||'').replace(/"/g,'&quot;')}">
      <label>Opciones (elegí cuál es la correcta)</label>
      ${r.question.opts.map((o,oi)=>`
        <div class="opt-row">
          <input type="radio" name="correct-${ri}" data-r="${ri}" data-o="${oi}" class="opt-correct" ${o.c?'checked':''}>
          <input type="text" data-r="${ri}" data-o="${oi}" class="opt-text" value="${(o.t||'').replace(/"/g,'&quot;')}" placeholder="${letters[oi]}">
        </div>
      `).join('')}
    `;
    wrap.appendChild(block);
  });
}

document.getElementById('save-rounds').addEventListener('click', ()=>{
  document.querySelectorAll('#rounds-editor textarea[data-f="intro"]').forEach(el=>{
    rounds[el.dataset.r].intro = el.value;
  });
  document.querySelectorAll('#rounds-editor input[data-f="qtext"]').forEach(el=>{
    rounds[el.dataset.r].question.text = el.value;
  });
  document.querySelectorAll('#rounds-editor .opt-text').forEach(el=>{
    rounds[el.dataset.r].question.opts[el.dataset.o].t = el.value;
  });
  document.querySelectorAll('#rounds-editor .opt-correct').forEach(el=>{
    rounds[el.dataset.r].question.opts[el.dataset.o].c = el.checked;
  });
  db.ref('quizdata').set({rounds}).then(()=>{
    const note = document.getElementById('save-rounds-note');
    note.textContent = '✓ Rondas guardadas — se actualizó en vivo para todos.';
    setTimeout(()=>note.textContent='', 3000);
  });
});

/* ===================== CONTROL DE RONDAS (fase en vivo) ===================== */
function renderRoundControls(){
  const wrap = document.getElementById('round-controls');
  wrap.innerHTML = '';
  rounds.forEach((r, ri)=>{
    const round = ri+1;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#a3937a; width:56px; display:inline-flex; align-items:center;">Ronda ${round}</span>
      <button class="btn secondary small" data-action="intro" data-round="${round}">Mostrar intro</button>
      <button class="btn small" data-action="question" data-round="${round}">Mostrar pregunta</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const round = parseInt(btn.dataset.round, 10);
      const phase = btn.dataset.action;
      db.ref('quizstate').update({phase, round});
    });
  });
}

document.getElementById('btn-lobby').addEventListener('click', ()=>{
  db.ref('quizstate').set({phase:'lobby', round:0});
});
document.getElementById('btn-finish').addEventListener('click', ()=>{
  db.ref('quizstate').update({phase:'finished'});
});
document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(!confirm('¿Reiniciar el quiz? Esto borra las respuestas de todos los jugadores y los vuelve a mandar al lobby.')) return;
  db.ref('quizstate').set({phase:'lobby', round:0, resetToken: Date.now()});
});

/* ===================== ESTADO EN VIVO (pill) ===================== */
db.ref('quizstate').on('value', (snap)=>{
  quizstate = snap.val() || {phase:'lobby', round:0};
  const labels = {lobby:'En lobby', intro:'Introducción ronda '+quizstate.round, question:'Pregunta ronda '+quizstate.round, finished:'Quiz finalizado'};
  document.getElementById('state-pill').textContent = labels[quizstate.phase] || quizstate.phase;
});

/* ===================== USUARIOS CONECTADOS ===================== */
db.ref('users').on('value', (snap)=>{
  users = snap.val() || {};
  const ids = Object.keys(users);
  document.getElementById('user-count').textContent = ids.length;
  const list = document.getElementById('user-list');
  if(ids.length === 0){
    list.innerHTML = '<div class="empty">Nadie se conectó todavía.</div>';
    return;
  }
  list.innerHTML = '';
  ids.forEach(id=>{
    const u = users[id];
    const answers = u.answers || [];
    const correct = answers.filter(a=>a.correct).length;
    const item = document.createElement('div');
    item.className = 'user-item';
    item.innerHTML = `
      <div>
        <div class="name">${u.name || 'Anónimo'}</div>
        <div class="meta">${u.device || 'Dispositivo desconocido'}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="score">${correct}/${rounds.length}</span>
        <button class="btn danger small" data-id="${id}">Expulsar</button>
      </div>
    `;
    item.querySelector('button').addEventListener('click', ()=>{
      if(confirm('¿Expulsar a '+(u.name||'este jugador')+'?')){
        db.ref('users/'+id).remove();
      }
    });
    list.appendChild(item);
  });
});
</script>
</body>
</html>
